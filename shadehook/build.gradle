plugins { id 'com.android.application' }

android {
 namespace 'com.kioskmdm.shadehook'
 compileSdk 35
 // Sign with the same persistent CI key as the main kiosk APK, not a new
 // automatically generated key from an ephemeral GitHub Actions worker.
 signingConfigs {
  debug {
   storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 defaultConfig {
  applicationId 'com.kioskmdm.shadehook'
  minSdk 27
  targetSdk 27
  versionCode 2
  versionName '0.2-signed'
 }
}
dependencies { compileOnly project(':xposedapi') }
