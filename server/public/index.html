<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נסיעה כשרה — ניהול מרחוק</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
<link rel="shortcut icon" href="favicon.svg?v=3">
</head>
<body>
<header>
  <span class="brand-wrap"><svg class="logo-sm" viewBox="-4 -4 140 186" aria-hidden="true"><path d="M66 0 L132 24 L132 86 C132 130 102 160 66 178 C30 160 0 130 0 86 L0 24 Z" fill="#0F8F8C" fill-opacity=".18" stroke="#2ED3C6" stroke-width="5" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#2ED3C6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 6" stroke-linecap="round"/></svg><span class="brand">נסיעה כשרה</span></span>
  <span class="who" id="who"></span>
</header>

<!-- כניסה -->
<div class="container" id="view-login">
  <div class="login-logo"><svg class="logo-lg" viewBox="-4 -4 140 186" aria-hidden="true"><path d="M66 0 L132 24 L132 86 C132 130 102 160 66 178 C30 160 0 130 0 86 L0 24 Z" fill="#0F8F8C" fill-opacity=".18" stroke="#2ED3C6" stroke-width="5" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#2ED3C6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 6" stroke-linecap="round"/><text x="66" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#2ED3C6">נסיעה כשרה</text></svg></div>
  <div class="card" style="max-width:380px;margin:16px auto 40px">
    <h3>כניסת מנהל</h3>
    <input type="text" id="u" placeholder="שם משתמש" autocomplete="username">
    <input type="password" id="p" placeholder="סיסמה" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button onclick="doLogin()">כניסה</button>
  </div>
</div>

<!-- רשימת מכשירים -->
<div class="container hidden" id="view-devices">
  <div class="card">
    <h3>כניסה למכשיר לפי מספר</h3>
    <div class="muted">המספר מופיע באפליקציה במכשיר, בראש המסך.</div>
    <div class="grid2">
      <input type="text" id="devNum" inputmode="numeric" placeholder="מספר מכשיר, למשל 100"
             onkeydown="if(event.key==='Enter')openByNumber()">
      <button onclick="openByNumber()">כניסה</button>
    </div>
    <span class="err" id="numErr"></span>
  </div>
  <div class="card">
    <h3>כל המכשירים</h3>
    <input type="text" id="devFilter" placeholder="חיפוש לפי מספר או שם" oninput="renderDeviceList()">
    <div id="deviceList"></div>
  </div>
</div>

<!-- דף מכשיר -->
<div class="container hidden" id="view-device">
  <button class="ghost" onclick="showDevices()">← חזרה לרשימה</button>
  <div id="deviceBody"></div>
</div>

<script src="app.js"></script>
</body>
</html>
