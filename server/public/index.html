<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נסיעה כשרה — ניהול מרחוק</title>
<link rel="stylesheet" href="style.css">
<!-- האייקון מוטמע בדף עצמו: נטפרי מחליף תמונות שנטענות מהרשת, אבל לא תמונה שמוטמעת בדף -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22-6%20-6%20144%20190%22%3E%3Cpath%20d%3D%22M66%200%20L132%2024%20L132%2086%20C132%20130%20102%20160%2066%20178%20C30%20160%200%20130%200%2086%20L0%2024%20Z%22%20fill%3D%22%230b2b2a%22%20stroke%3D%22%230F8F8C%22%20stroke-width%3D%2210%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M40%2084%20L60%20104%20L94%2062%22%20fill%3D%22none%22%20stroke%3D%22%230F8F8C%22%20stroke-width%3D%2216%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
</head>
<body>
<header>
  <span class="brand-wrap"><svg class="logo-sm" viewBox="-4 -4 140 186" aria-hidden="true"><path d="M66 0 L132 24 L132 86 C132 130 102 160 66 178 C30 160 0 130 0 86 L0 24 Z" fill="#0F8F8C" fill-opacity=".18" stroke="#0F8F8C" stroke-width="5" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#0F8F8C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 6" stroke-linecap="round"/></svg><span class="brand">נסיעה כשרה</span></span>
  <span class="who" id="who"></span>
</header>

<!-- כניסה -->
<div class="container" id="view-login">
  <div class="login-logo"><svg class="logo-lg" viewBox="-4 -4 140 186" aria-hidden="true"><path d="M66 0 L132 24 L132 86 C132 130 102 160 66 178 C30 160 0 130 0 86 L0 24 Z" fill="#0F8F8C" fill-opacity=".18" stroke="#0F8F8C" stroke-width="5" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#0F8F8C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 74 L60 90 L88 58" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 6" stroke-linecap="round"/><text x="66" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#0F8F8C">נסיעה כשרה</text></svg></div>
  <div class="card" style="max-width:380px;margin:16px auto 40px">
    <h3>כניסת מנהל</h3>
    <input type="text" id="u" placeholder="שם משתמש" autocomplete="username">
    <input type="password" id="p" placeholder="סיסמה" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button onclick="doLogin()">כניסה</button>
  </div>
</div>

<!-- רשימת מכשירים -->
<div class="container hidden" id="view-devices">
  <div class="card">
    <h3>כניסה למכשיר לפי מספר</h3>
    <div class="muted">המספר מופיע באפליקציה במכשיר, בראש המסך.</div>
    <div class="grid2">
      <input type="text" id="devNum" inputmode="numeric" placeholder="מספר מכשיר, למשל 100"
             onkeydown="if(event.key==='Enter')openByNumber()">
      <button onclick="openByNumber()">כניסה</button>
    </div>
    <span class="err" id="numErr"></span>
  </div>
  <div class="card">
    <h3>כל המכשירים</h3>
    <input type="text" id="devFilter" placeholder="חיפוש לפי מספר או שם" oninput="renderDeviceList()">
    <div id="deviceList"></div>
  </div>
</div>

<!-- דף מכשיר -->
<div class="container hidden" id="view-device">
  <button class="ghost" onclick="showDevices()">← חזרה לרשימה</button>
  <div id="deviceBody"></div>
</div>

<script src="app.js"></script>
</body>
</html>
