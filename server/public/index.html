<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נתיב נקי — ניהול מרחוק</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="brand">נתיב נקי</span>
  <span class="who" id="who"></span>
</header>

<!-- כניסה -->
<div class="container" id="view-login">
  <div class="card" style="max-width:380px;margin:40px auto">
    <h3>כניסת מנהל</h3>
    <input type="text" id="u" placeholder="שם משתמש" autocomplete="username">
    <input type="password" id="p" placeholder="סיסמה" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button onclick="doLogin()">כניסה</button>
  </div>
</div>

<!-- רשימת מכשירים -->
<div class="container hidden" id="view-devices">
  <div class="card">
    <h3>כניסה למכשיר לפי מספר</h3>
    <div class="muted">המספר מופיע באפליקציה במכשיר, בראש המסך.</div>
    <div class="grid2">
      <input type="text" id="devNum" inputmode="numeric" placeholder="מספר מכשיר, למשל 100"
             onkeydown="if(event.key==='Enter')openByNumber()">
      <button onclick="openByNumber()">כניסה</button>
    </div>
    <span class="err" id="numErr"></span>
  </div>
  <div class="card">
    <h3>כל המכשירים</h3>
    <input type="text" id="devFilter" placeholder="חיפוש לפי מספר או שם" oninput="renderDeviceList()">
    <div id="deviceList"></div>
  </div>
</div>

<!-- דף מכשיר -->
<div class="container hidden" id="view-device">
  <button class="ghost" onclick="showDevices()">← חזרה לרשימה</button>
  <div id="deviceBody"></div>
</div>

<script src="app.js"></script>
</body>
</html>
