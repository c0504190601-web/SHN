name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'codex/kiosk-v23-back-design-rotation' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kioskmdm-signing-key-v1

      - name: Ensure signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KioskMDM,O=KioskMDM,C=IL"
          fi

      - name: Check Back hold timing
        run: |
          mkdir -p /tmp/kiosk-tests
          javac -d /tmp/kiosk-tests app/src/main/java/com/kioskmdm/BackHoldState.java tests/BackHoldStateTest.java
          java -cp /tmp/kiosk-tests com.kioskmdm.BackHoldStateTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug lintDebug

      - name: Verify APK uses the persistent signing key
        run: |
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file /tmp/kiosk-signing-cert.der
          expected_fingerprint=$(sha256sum /tmp/kiosk-signing-cert.der | cut -d ' ' -f 1)
          apk_signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apk_signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > /tmp/kiosk-apk-signature.txt
          cat /tmp/kiosk-apk-signature.txt
          actual_fingerprint=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/kiosk-apk-signature.txt | sort -u | tr -d '[:space:]')
          test "$actual_fingerprint" = "$expected_fingerprint"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KioskMDM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
