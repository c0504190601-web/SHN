name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'codex/kiosk-v23-back-design-rotation' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore persistent signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kioskmdm-signing-key-v1

      - name: Ensure signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=KioskMDM,O=KioskMDM,C=IL"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug lintDebug

      - name: Verify APK uses the persistent signing key
        run: |
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file /tmp/kiosk-signing-cert.der
          expected_fingerprint=$(sha256sum /tmp/kiosk-signing-cert.der | cut -d ' ' -f 1)
          apk_signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apk_signer" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > /tmp/kiosk-apk-signature.txt
          cat /tmp/kiosk-apk-signature.txt
          actual_fingerprint=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/kiosk-apk-signature.txt | sort -u | tr -d '[:space:]')
          test "$actual_fingerprint" = "$expected_fingerprint"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KioskMDM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-81-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare test signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Emulator test,O=KioskMDM,C=IL"
          fi
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test Android 8.1 Back and quick settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: default
          arch: x86
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .ci/test-android.sh
      - name: Upload device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-8.1-test-evidence
          path: |
            test-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
